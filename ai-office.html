<title>AI 비서 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&family=Silkscreen&display=swap">
<style>
/* Layout: a pixel office floor (rooms per department) on the left, a boss's side panel (staff / approvals / projects / log) on the right. */
:root {
  --bg: #E9EEF2; --panel: #FFFFFF; --panel-2: #F3F6F9; --ink: #1F2933; --muted: #5C6876;
  --line: #C9D3DC; --line-strong: #93A2B0; --shadow: #B7C3CE;
  --floor-a: #DCE6EE; --floor-b: #D1DDE7; --wall: #C3D2DE;
  --accent: #4E62F5; --accent-ink: #FFFFFF; --chip: #E8ECFF;
  --gold: #C98408; --good: #1B8F61; --warn: #C46F17; --bad: #CC3D3D;
  --f-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111720; --panel: #1A222D; --panel-2: #212B38; --ink: #E5EAF0; --muted: #98A5B3;
  --line: #2E3A49; --line-strong: #4A5A6D; --shadow: #070A0F;
  --floor-a: #1E2834; --floor-b: #1A232E; --wall: #263243;
  --accent: #8291FF; --accent-ink: #0D1120; --chip: #252E4D;
  --gold: #F2B33D; --good: #3CC78E; --warn: #F0A04B; --bad: #F07070; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111720; --panel: #1A222D; --panel-2: #212B38; --ink: #E5EAF0; --muted: #98A5B3;
  --line: #2E3A49; --line-strong: #4A5A6D; --shadow: #070A0F;
  --floor-a: #1E2834; --floor-b: #1A232E; --wall: #263243;
  --accent: #8291FF; --accent-ink: #0D1120; --chip: #252E4D;
  --gold: #F2B33D; --good: #3CC78E; --warn: #F0A04B; --bad: #F07070; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }

/* pixel-ish boxes */
.box { background: var(--panel); border: 2px solid var(--line-strong); border-radius: 8px; box-shadow: 3px 3px 0 var(--shadow); }
.btn { border: 2px solid var(--line-strong); background: var(--panel); border-radius: 7px; padding: 6px 12px; box-shadow: 2px 2px 0 var(--shadow); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { box-shadow: none; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--ink); white-space: nowrap; }
.dept-chip { color: #FFFFFF; }
.muted { color: var(--muted); }
.num { font-family: var(--f-pixel); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.brand h1 { font-size: 24px; line-height: 1.1; }
.brand-name { background: none; border: 0; padding: 0; text-align: left; }
.brand-name:hover h1 { text-decoration: underline dotted; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.clock { font-family: var(--f-pixel); font-size: 18px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: flex; flex-direction: column; padding: 4px 10px; border: 2px solid var(--line); border-radius: 7px; background: var(--panel-2); min-width: 72px; }
.stat b { font-family: var(--f-pixel); font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* sky band */
.sky { position: relative; height: 54px; border-radius: 8px 8px 0 0; overflow: hidden; border: 2px solid var(--line-strong); border-bottom: 0; }
.sky .orb { position: absolute; width: 22px; height: 22px; border-radius: 4px; top: 14px; }
.sky .sky-label { position: absolute; right: 10px; top: 8px; font-family: var(--f-display); font-size: 15px; padding: 2px 10px; border-radius: 6px; background: rgba(0,0,0,.28); color: #FFFFFF; }
.sky .mullion { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 118px, var(--wall) 118px 124px); }
.office { border-radius: 0 0 8px 8px; border-top-width: 2px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 14px; }
.room { border: 2px solid var(--line-strong); border-radius: 8px; background-color: var(--floor-a);
  background-image: linear-gradient(45deg, var(--floor-b) 25%, transparent 25%, transparent 75%, var(--floor-b) 75%), linear-gradient(45deg, var(--floor-b) 25%, transparent 25%, transparent 75%, var(--floor-b) 75%);
  background-size: 24px 24px; background-position: 0 0, 12px 12px; min-width: 0; }
.room.site { background-image: repeating-linear-gradient(135deg, var(--floor-b) 0 10px, var(--floor-a) 10px 20px); }
.room-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--wall); border-bottom: 2px solid var(--line-strong); border-radius: 6px 6px 0 0; }
.room-head h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.room-head .dot { width: 10px; height: 10px; border-radius: 2px; }
.desks { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 8px 12px; }
.desk { position: relative; width: 104px; padding: 26px 4px 4px; border: 2px solid transparent; border-radius: 8px; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.desk:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel) 45%, transparent); }
.desk.sel { border-color: var(--accent); background: color-mix(in srgb, var(--panel) 60%, transparent); }
.desk canvas { width: 96px; height: 78px; image-rendering: pixelated; }
.plate { display: flex; flex-direction: column; align-items: center; line-height: 1.25; max-width: 100%; }
.plate b { font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.plate small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
.bubble { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; padding: 1px 7px; border-radius: 6px; background: var(--panel); border: 2px solid var(--line-strong); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--line-strong); }
.st-off .bubble { color: var(--muted); border-color: var(--line); }
.st-off .bubble::after { border-top-color: var(--line); }
.st-work .bubble { color: var(--accent); border-color: var(--accent); }
.st-work .bubble::after { border-top-color: var(--accent); }
.st-review .bubble { color: var(--gold); border-color: var(--gold); animation: nudge 1.2s ease-in-out infinite; }
.st-review .bubble::after { border-top-color: var(--gold); }
.st-stuck .bubble { color: var(--bad); border-color: var(--bad); }
.st-stuck .bubble::after { border-top-color: var(--bad); }
.st-off .plate b { color: var(--muted); }
.desk.hire { justify-content: center; min-height: 128px; border: 2px dashed var(--line-strong); color: var(--muted); font-weight: 600; font-size: 12px; padding-top: 4px; }
.desk.hire:hover { color: var(--accent); border-color: var(--accent); }
.desk.arrive canvas { animation: hop .6s ease-out; }
@keyframes hop { 0% { transform: translateY(-18px); opacity: 0 } 60% { transform: translateY(3px); opacity: 1 } 100% { transform: none } }
@keyframes nudge { 0%,100% { transform: translateX(-50%) } 50% { transform: translateX(-50%) translateY(-3px) } }
@media (prefers-reduced-motion: reduce) { .desk.arrive canvas, .st-review .bubble { animation: none } .btn:hover { transform: none } }

/* side panel */
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; max-height: calc(100vh - 24px); min-width: 0; }
@media (max-width: 980px) { .panel { position: static; max-height: none; } }
.tabs { display: flex; border-bottom: 2px solid var(--line-strong); }
.tab { flex: 1; border: 0; background: transparent; padding: 10px 4px; font-family: var(--f-display); font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cnt { font-family: var(--f-pixel); font-size: 11px; background: var(--gold); color: #FFFFFF; border-radius: 6px; padding: 0 5px; margin-left: 3px; }
.pbody { padding: 14px; overflow: auto; display: grid; gap: 14px; align-content: start; min-height: 0; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.input, select.input, textarea.input { width: 100%; border: 2px solid var(--line-strong); border-radius: 7px; background: var(--panel-2); padding: 7px 9px; }
textarea.input { resize: vertical; min-height: 84px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; }
.sug { border: 1.5px dashed var(--line-strong); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); text-align: left; }
.sug:hover { color: var(--accent); border-color: var(--accent); }

.agent-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.agent-card canvas { width: 128px; height: 104px; image-rendering: pixelated; background: var(--floor-a); border-radius: 8px; border: 2px solid var(--line); }
.agent-card h2 { font-size: 24px; }
.meter { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.bar { height: 10px; border: 2px solid var(--line-strong); border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.energy i { background: var(--good); }
.bar.low i { background: var(--warn); }

.list { display: grid; gap: 8px; }
.item { display: grid; gap: 4px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel-2); text-align: left; width: 100%; }
.item:hover { border-color: var(--line-strong); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.item .pv { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.s-queued { background: var(--chip); }
.s-working { background: var(--accent); color: var(--accent-ink); }
.s-review { background: var(--gold); color: #FFFFFF; }
.s-done { background: var(--good); color: #FFFFFF; }
.s-failed, .s-stuck { background: var(--bad); color: #FFFFFF; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sect-h h3 { font-size: 17px; }
.empty { border: 2px dashed var(--line-strong); border-radius: 8px; padding: 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { font-size: 12.5px; color: var(--muted); background: var(--panel-2); border-radius: 7px; padding: 8px 10px; border: 1.5px solid var(--line); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 7px; border: 2px solid var(--bad); }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 22, .5); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; min-width: 0; }
.modal-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 2px solid var(--line); }
.modal-h h2 { font-size: 20px; overflow-wrap: anywhere; }
.modal-b { padding: 16px; overflow: auto; display: grid; gap: 14px; min-height: 0; }
.modal-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 2px solid var(--line); }
.doc { font-size: 14.5px; line-height: 1.75; max-width: 68ch; overflow-wrap: anywhere; }
.doc h4 { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 16px 0 4px; }
.doc p { margin: 6px 0; }
.doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
.doc code { background: var(--panel-2); padding: 0 4px; border-radius: 4px; font-size: 13px; }
.doc .tbl { font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre; overflow-x: auto; margin: 0; }
.doc blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.doc hr { border: 0; border-top: 2px dashed var(--line); margin: 12px 0; }
.thinking { color: var(--muted); font-style: italic; }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.role-opt { text-align: left; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel-2); display: grid; gap: 2px; }
.role-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); }
.role-opt b { font-size: 13.5px; }
.role-opt small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.prop { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; padding: 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.prop textarea { min-height: 56px; }

.toasts { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; display: grid; justify-items: center; gap: 6px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; box-shadow: 3px 3px 0 var(--shadow); max-width: 100%; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); font-family: var(--f-display); font-size: 18px; }
</style>

<div class="wrap">
  <header class="top box">
    <div class="brand">
      <canvas class="logo" id="logo" width="16" height="16" aria-hidden="true"></canvas>
      <button class="brand-name" id="brandBtn" title="회사 이름 바꾸기">
        <h1 id="companyName">내 AI 오피스</h1>
        <small>사장님 전용 비서실 · <span class="clock" id="clock">--:--</span></small>
      </button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="top-actions">
      <button class="btn" id="allIn">전체 출근</button>
      <button class="btn" id="allOut">전체 퇴근</button>
      <button class="btn" id="meetingBtn">아침 회의</button>
      <button class="btn primary" id="hireBtn">비서 채용</button>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="sky" id="sky" aria-hidden="true"></div>
      <section class="office box" id="office"><div class="loading">사무실 불 켜는 중…</div></section>
    </main>
    <aside class="panel box" id="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>

function agentState(a) {
  if (!a.onDuty) return { s: "off", label: "퇴근" };
  const ts = tasksSorted().filter(t => t.agentId === a.id);
  const w = ts.find(t => running.has(t.id));
  if (w) { const txt = running.get(w.id).text || ""; return { s: "work", label: txt ? `작업 중 ${Math.min(95, Math.round(txt.length / 16))}%` : "생각 중…", task: w }; }
  if (ts.some(t => taskState(t) === "stuck" || t.status === "failed")) return { s: "stuck", label: "확인 필요" };

function startWatch() {
  if (!mcpNS || sessUnwatch) return;
  sessUnwatch = mcpNS.watchTool(CCR, "list_sessions", { mine: true, limit: 50 }, ev => {
    if (ev.type === "data") applySessions(ev.result);
    else { sessErr(ev.error); if (["approval_required", "not_in_manifest"].includes(ev.error?.code)) { sessUnwatch?.(); sessUnwatch = null; } }
  }, { refetchInterval: 60000 });
}
async function connectSessions() {
  if (!mcpNS) return;
  SESS.state = "loading"; renderAll();
  try { const r = await mcpNS.callTool(CCR, "list_sessions", { mine: true, limit: 50 }); applySessions(r); startWatch(); }
  catch (e) { sessErr(e); }
}
async function initSessions() {
  if (!window.claude?.use) { SESS.state = "none"; renderAll(); return; }
  try { mcpNS = await window.claude.use("mcp"); } catch { mcpNS = null; }
  if (!mcpNS) { SESS.state = "none"; renderAll(); return; }
  let st = "prompt";
  try { const perms = await window.claude.use("permissions"); if (perms) st = await perms.state("mcp:" + CCR).catch(() => "prompt"); } catch {}
  if (st === "granted") { SESS.state = "loading"; renderAll(); startWatch(); }
  else { SESS.state = st === "unavailable" ? "none" : "connect"; renderAll(); }
}
function sessState(x) {
  const b = String(x.status_bucket || "");
  if (b.includes("WORKING")) return { s: "work", label: "작업 중" };
  if (b.includes("BLOCKED")) return { s: "review", label: "승인 필요!" };
  if (b.includes("REVIEW")) return { s: "review", label: "검토해 주세요" };
  if (b.includes("FAILED")) return { s: "stuck", label: "오류" };
  return { s: "idle", label: "대기 중" };
}
const sessTitle = x => (x.title && x.title !== "New session" ? x.title : (projectForSession(x.id)?.name || "새 세션"));
const sessNote = x => x.post_turn_summary?.needs_action || x.task_summary || x.post_turn_summary?.recent_action || "";

${p ? `[프로젝트] ${p.name}\n- 목표: ${p.goal || "미정"}\n- 수익 방식: ${p.revenue || "미정"}\n- 현재 상황·메모: ${p.notes || "없음"}${siteLine(p)}` : "[프로젝트] 지정 없음"}

${t.title}
${t.feedback ? `\n[이전 결과물]\n${String(t.prevResult || "").slice(0, 6000)}\n\n[사장님 반려 피드백]\n${t.feedback}\n피드백을 반영해 결과물을 처음부터 다시 완성하라.\n` : ""}
[작성 규칙]
- 한국어로, 사장님이 바로 쓰거나 실행할 수 있는 완성된 결과물을 낸다. 계획만 말하지 말고 실제 산출물(문구, 표, 목록, 초안)을 쓴다.
- 실제 수치나 최신 정보처럼 모르는 사실은 지어내지 말고 '확인 필요'로 표시하고, 가정은 가정이라고 밝힌다.
- 첫 줄은 한 문장 요약. 소제목은 '## ', 목록은 '- '를 쓴다.
- 마지막에 '## 다음 제안' 아래 이어서 할 일 2개를 적는다.
- 분량은 1,500자 안팎, 필요하면 더 길어도 된다.`;
}
async function runTask(id) {
  const t0 = S.tasks.get(id); if (!t0 || running.has(id)) return;
  const ctl = new AbortController(); running.set(id, { ctl, text: "" });
  const t = { id, ...t0 };
  await patch("tasks", id, { status: "working", startedAt: now(), error: null });
  updateBubbles(); renderHeader(); renderPanelDynamic(); refreshModal(id);
  try {
    const res = await sample(taskPrompt(t), {
      signal: ctl.signal, cache: false,
      onText: ({ text }) => { const r = running.get(id); if (r) r.text = text; updateBubbles(); liveModal(id, text); },
    });
    running.delete(id);
    await patch("tasks", id, { status: "review", result: res.text + (res.truncated ? "\n\n(분량 제한으로 여기서 끊겼어요. 나눠서 지시해 주세요.)" : ""), finishedAt: now() });
    const a = S.agents.get(t.agentId); if (a) await patch("agents", t.agentId, { energy: Math.max(0, (a.energy ?? 100) - 12) });
    toast(`${a?.name || "비서"}: 결재 올렸어요!`);
  } catch (e) {
    const partial = e && e.text ? e.text : "";
    running.delete(id);
    if (e && e.code === "cancelled") await patch("tasks", id, { status: "stopped", result: partial, finishedAt: now() });
    else {
      const msg = { not_granted: "Claude 사용을 허용하지 않아 업무를 못 했어요.", rate_limited: "Claude 사용량이 많아요. 잠시 뒤 다시 시작해 주세요.", sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어요.", refused: "이 지시는 처리할 수 없다고 해요. 지시를 바꿔 주세요.", session_expired: "다시 로그인해 주세요." }[e && e.code] || "작업 중 연결이 끊겼어요. 다시 시작해 주세요.";
      await patch("tasks", id, { status: "failed", error: msg, result: partial, finishedAt: now() });
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { sample = null; pumpArmed = false; }
      if (e && e.code === "rate_limited") pumpArmed = false;
      toast(msg);
    }
  } finally { renderAll(); refreshModal(id); pump(); }
}
function pump() {
  if (!sample || !pumpArmed) return;
  const busyAgents = new Set([...running.keys()].map(id => S.tasks.get(id)?.agentId));
  const q = tasksSorted().filter(t => t.status === "queued" && S.agents.get(t.agentId)?.onDuty).reverse();
  for (const t of q) {
    if (running.size >= 2) break;
    if (busyAgents.has(t.agentId)) continue;
    busyAgents.add(t.agentId); runTask(t.id);
  }
}

  const id = uid("t_");
  await put("tasks", id, { agentId, projectId: projectId || null, title, status: "queued", source, createdAt: now() });
  return id;
}

  if (el.closest("#modalRoot") && $("#modalRoot").onclick) return;
  const desk = el.closest("[data-agent]");
  if (desk) { selected = desk.dataset.agent; tab = "agent"; confirmFire = false; renderAll(true); if (innerWidth <= 980) $("#panel").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); return; }
  if (el.closest("[data-act=hire]")) { if (S.agents.size >= MAX_STAFF) { toast(`비서는 최대 ${MAX_STAFF}명까지예요.`); return; } openHire(el.closest("[data-act=hire]").dataset.dept); return; }
  if (el.closest("#starter")) {
    const base = now();
    for (let i = 0; i < STARTER.length; i++) await put("agents", uid("a_"), { name: STARTER[i][0], role: STARTER[i][1], onDuty: false, xp: 0, energy: 100, hiredAt: base + i });
    toast("기본 팀 12명이 입사했어요. 전체 출근을 눌러 보세요!"); return;
  }
  const sd = el.closest("[data-session]");
  if (sd) { selectedSession = sd.dataset.session; tab = "field"; renderAll(true); if (innerWidth <= 980) $("#panel").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); return; }
  const tb = el.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; editProject = null; renderPanel(); return; }
  const ti = el.closest("[data-task]"); if (ti) { openTask(ti.dataset.task); return; }
  const sg = el.closest("[data-sug]"); if (sg) { const ta = $("#f-task"); ta.value = sg.dataset.sug; drafts[selected] = { ...(drafts[selected] || {}), task: ta.value }; ta.focus(); return; }
  const pe = el.closest("[data-pedit]"); if (pe) { editProject = pe.dataset.pedit; renderPanel(); return; }
  const pd = el.closest("[data-pdel]"); if (pd) { await del("projects", pd.dataset.pdel); toast("프로젝트를 삭제했어요."); return; }
  if (el.closest("[data-close]") || el.id === "ov") { if (meetingCtl) { meetingCtl.abort(); meetingCtl = null; } closeModal(); return; }
  const id = el.closest("button")?.id;
  const a = selected ? S.agents.get(selected) : null;
  switch (id) {
    case "allIn": { const off = agentsSorted().filter(x => !x.onDuty); for (const x of off) await patch("agents", x.id, { onDuty: true, energy: 100, dutyAt: now() }); toast(off.length ? `${off.length}명 출근!` : "모두 이미 출근했어요."); break; }
    case "allOut": { const busy = agentsSorted().filter(x => x.onDuty); let n = 0; for (const x of busy) { if ([...running.keys()].some(k => S.tasks.get(k)?.agentId === x.id)) continue; await patch("agents", x.id, { onDuty: false }); n++; } toast(n ? `${n}명 퇴근. 수고했어요!` : "작업 중인 비서는 일을 마치고 퇴근해요."); break; }
    case "meetingBtn": openMeeting(); break;
    case "mt-cancel": if (meetingCtl) { meetingCtl.abort(); meetingCtl = null; } closeModal(); break;
    case "hireBtn": if (S.agents.size >= MAX_STAFF) toast(`비서는 최대 ${MAX_STAFF}명까지예요.`); else openHire(); break;
    case "brandBtn": {
      const cur = S.meta.companyName || "내 AI 오피스";
      $("#brandBtn").outerHTML = `<form id="nameForm" class="row"><input class="input" id="nameIn" value="${esc(cur)}" maxlength="20" style="width:200px"><button class="btn sm primary">저장</button></form>`;
      $("#nameIn").focus(); $("#nameIn").select();
      $("#nameForm").onsubmit = async ev => { ev.preventDefault(); const v = $("#nameIn").value.trim().slice(0, 20) || "내 AI 오피스"; $("#nameForm").outerHTML = `<button class="brand-name" id="brandBtn" title="회사 이름 바꾸기"><h1 id="companyName"></h1><small>사장님 전용 비서실 · <span class="clock" id="clock">--:--</span></small></button>`; await putMeta({ companyName: v }); renderHeader(); renderSky(); };
      break;
    }
    case "dutyBtn": if (a) { if (a.onDuty && [...running.keys()].some(k => S.tasks.get(k)?.agentId === selected)) { toast("작업을 마친 뒤에 퇴근시킬 수 있어요."); break; } await patch("agents", selected, a.onDuty ? { onDuty: false } : { onDuty: true, energy: 100, dutyAt: now() }); if (!a.onDuty) pump(); } break;
    case "coffee": if (a) { await patch("agents", selected, { energy: Math.min(100, (a.energy ?? 100) + 25) }); toast(`${a.name}: 커피 고마워요!`); } break;
    case "fire": confirmFire = true; renderPanelDynamic(); break;
    case "fireNo": confirmFire = false; renderPanelDynamic(); break;
    case "fireYes": if (a) { const nm = a.name; await del("agents", selected); selected = null; confirmFire = false; renderAll(true); toast(`${nm} 님을 내보냈어요.`); } break;
    case "assign": {
      if (!a) break; const txt = $("#f-task").value.trim(); if (!txt) { toast("무슨 일을 시킬지 적어 주세요."); $("#f-task").focus(); break; }
      const pid = $("#f-project").value;
      await assign(selected, pid, txt); drafts[selected] = { project: pid }; $("#f-task").value = "";
      if (pid !== (S.meta.lastProject || "")) putMeta({ lastProject: pid });
      if (!a.onDuty) await patch("agents", selected, { onDuty: true, energy: 100, dutyAt: now() });
      pumpArmed = true; pump(); toast(sample ? `${a.name}에게 지시했어요.` : "대기열에 저장했어요.");
      break;
    }
    case "sessConnect": connectSessions(); break;
    case "sessSend": {
      const sid = selectedSession, msg = ($("#s-msg")?.value || "").trim();
      if (!sid || !msg) { toast("보낼 내용을 적어 주세요."); break; }
      const btn = $("#sessSend"); btn.disabled = true; $("#sendNote").textContent = "보내는 중…";
      try {
        await mcpNS.callTool(CCR, "send_message", { session_id: sid, message: msg.slice(0, 60000) });
        sendDrafts[sid] = ""; if ($("#s-msg")) $("#s-msg").value = "";
        toast("세션에 보냈어요."); if ($("#sendNote")) $("#sendNote").textContent = "보냈어요. 몇 분 안에 세션 상태가 바뀌어요.";
        mcpNS.invalidate(CCR, "list_sessions").catch(() => {});
      } catch (e) {
        const m = { needs_reauth: "커넥터 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.", not_in_manifest: "세션에 보내기를 허용하지 않았어요.", approval_required: "보내려면 허용이 필요해요. 다시 눌러 허용해 주세요.", blocked_by_policy: "조직 정책으로 보낼 수 없어요.", tool_error: "세션이 메시지를 받지 않았어요. 세션이 보관됐는지 확인해 주세요.", server_unavailable: "전달됐는지 확인하지 못했어요. 세션을 열어 확인한 뒤 다시 보내 주세요.", upstream_error: "전달됐는지 확인하지 못했어요. 세션을 열어 확인한 뒤 다시 보내 주세요." }[e?.code] || "보내지 못했어요.";
        if ($("#sendNote")) $("#sendNote").textContent = m; toast(m);
      } finally { if ($("#sessSend")) $("#sessSend").disabled = false; }
      break;
    }
    case "m-forward": {
      const t = S.tasks.get(modalTask), p = t && S.projects.get(t.projectId), ag = t && S.agents.get(t.agentId);
      if (!p?.sessionId) break;
      sendDrafts[p.sessionId] = `[비서실 전달] ${ag?.name || "비서"}(${ROLE[ag?.role]?.title || "비서"})가 만든 결과물이에요. 사장님이 승인한 내용이니 검토해서 이 프로젝트에 반영할 부분을 반영하고, 무엇을 바꿨는지 알려 주세요.\n\n지시: ${t.title}\n\n${String(t.result || "").slice(0, 20000)}`;
      selectedSession = p.sessionId; tab = "field"; closeModal(); renderAll(true); break;
    }
    case "startQueue": pumpArmed = true; pump(); renderPanelDynamic(); break;
    case "p-new": editProject = "new"; renderPanel(); break;
    case "p-cancel": editProject = null; renderPanel(); break;
    case "p-save": {
      const name = $("#p-name").value.trim(); if (!name) { toast("프로젝트 이름을 적어 주세요."); break; }
      const pid = editProject === "new" ? uid("p_") : editProject, prev = S.projects.get(pid) || {};
      await put("projects", pid, { name: name.slice(0, 60), goal: $("#p-goal").value.trim().slice(0, 200), revenue: $("#p-rev").value.trim().slice(0, 200), notes: $("#p-notes").value.trim().slice(0, 2000), sessionId: $("#p-sess").value || null, createdAt: prev.createdAt || now() });
      editProject = null; renderPanel(); toast("프로젝트를 저장했어요."); break;
    }
    // task modal
    case "m-stop": running.get(modalTask)?.ctl.abort(); break;
    case "m-copy": {
      const txt = running.get(modalTask)?.text || S.tasks.get(modalTask)?.result || "";
      navigator.clipboard.writeText(txt).then(() => toast("복사했어요."), () => { const r = document.createRange(); r.selectNodeContents($("#docBody")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("선택했어요. 복사 단축키를 눌러 주세요."); });
      break;
    }
    case "m-retry": { const tid = modalTask; await patch("tasks", tid, { status: "queued", error: null }); const ag = S.agents.get(S.tasks.get(tid)?.agentId); if (ag && !ag.onDuty) await patch("agents", S.tasks.get(tid).agentId, { onDuty: true, energy: 100 }); pumpArmed = true; pump(); refreshModal(tid); break; }
    case "m-ok": {
      const tid = modalTask, t = S.tasks.get(tid); if (!t) break;
      await patch("tasks", tid, { status: "done", approvedAt: now() });
      const ag = S.agents.get(t.agentId);
      if (ag) { const before = lvl(ag.xp); const xp = (ag.xp || 0) + 40; await patch("agents", t.agentId, { xp }); toast(lvl(xp) > before ? `${ag.name} 레벨 업! Lv.${lvl(xp)}` : `승인! ${ag.name} 경험치 +40`); }
      closeModal(); break;
    }
    case "m-reject": {
      const tid = modalTask, t = S.tasks.get(tid); const fb = $("#fb").value.trim();
      if (!fb) { toast("어떻게 고칠지 피드백을 적어 주세요."); $("#fb").focus(); break; }
      await patch("tasks", tid, { status: "queued", feedback: fb, prevResult: String(t.result || "").slice(0, 8000), result: "" });
      pumpArmed = true; pump(); refreshModal(tid); toast("다시 작업시켰어요."); break;
    }
    case "m-del": { const tid = modalTask; closeModal(); await del("tasks", tid); toast("기록을 삭제했어요."); break; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "s-msg" && selectedSession) sendDrafts[selectedSession] = e.target.value;
  if (!selected) return;
  if (e.target.id === "f-task") drafts[selected] = { ...(drafts[selected] || {}), task: e.target.value };
  if (e.target.id === "f-project") drafts[selected] = { ...(drafts[selected] || {}), project: e.target.value };
});
document.addEventListener("change", async e => {
  if (e.target.id !== "s-proj" || !selectedSession) return;
  const want = e.target.value, cur = projectForSession(selectedSession);
  if (cur && cur.id !== want) await patch("projects", cur.id, { sessionId: null });
  if (want) await patch("projects", want, { sessionId: selectedSession });
  toast(want ? "프로젝트와 연결했어요." : "연결을 풀었어요.");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov")) { if (meetingCtl) { meetingCtl.abort(); meetingCtl = null; } $("#modalRoot").onclick = null; closeModal(); } });

/* ---------- render orchestration ---------- */
let lastPanelKey = "";
function renderAll(forcePanel) {
  renderHeader(); renderOffice();
  const key = tab + "|" + selected + "|" + (selected && S.agents.has(selected)) + "|" + S.ready + "|" + editProject + "|" + selectedSession + "|" + (selectedSession && SESS.byId.has(selectedSession));
  if (forcePanel || key !== lastPanelKey) { lastPanelKey = key; renderPanel(); } else renderPanelDynamic();
  if (modalTask && !running.has(modalTask)) refreshModal(modalTask);
  if (pumpArmed) pump();
}

drawLogo(); renderSky(); setInterval(renderSky, 30000);
renderAll(true);
requestAnimationFrame(loop);
initStore();
initSessions();
})();
</script>
